<!--
  Hero "Fronteira". Cada peça é um componente em parts/ (navegação e granulado em presentation/shared/).
  Ordem de empilhamento, de trás para a frente:
    navegação (fora do palco, em px reais) ·
    palco escalado (hero.ts → layout()): fundo → trem → pistoleiros → mesa → foto e título → chão → chamadas ·
    granulado por cima de tudo
-->
<div #hero class="fr-hero" id="inicio" data-mode="d" [class.is-reduced]="reducedMotion" (pointermove)="onPointerMove($event)">
  <!-- Definições SVG usadas por mais de uma peça -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <!-- Hachura de gravura: sombras nas encostas (fundo e mesa) -->
      <pattern id="fr-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)" class="fr-hatch">
        <line x1="0" y1="0" x2="0" y2="7" />
      </pattern>
    </defs>
  </svg>

  <app-site-nav [chapters]="chapters" [current]="chapters[0]?.anchor ?? null" />

  <!-- Palco: 1440×900 no desktop, 880 de altura no mobile -->
  <div #stage class="fr-stage">
    <app-hero-backdrop [mobile]="mobile()" />
    <app-hero-train />
    <app-hero-riders />
    <app-hero-mesa />
    <app-hero-portrait [name]="profile.name" [photoUrl]="profile.photoUrl" />
    <app-hero-title [name]="profile.name" [role]="profile.role" />
    <app-hero-ground />
    <app-hero-ctas />
  </div>

  <app-grain />
</div>
